# Configuration for robot_localization EKF node
# Fuses /wheel/odom (vx, vyaw) and /imu/data (yaw, vyaw)
# Broadcasts TF: odom -> base_footprint

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    sensor_timeout: 0.1
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: false
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    publish_tf: true
    publish_acceleration: false

    # 1. Wheel Odometry from Gazebo diff-drive plugin
    # Only fuse velocity (vx, vyaw). Do NOT fuse absolute X, Y to prevent frame conflicts with IMU yaw
    odom0: wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    # 2. IMU Sensor (BNO055 / MPU6050)
    # Fuse orientation (yaw) and angular velocity (vyaw).
    # NEVER fuse linear acceleration (ax, ay, az) because double integration creates massive drift!
    imu0: imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true
